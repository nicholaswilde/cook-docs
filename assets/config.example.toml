# =============================================================================
# cook-docs Configuration Example (config.example.toml)
# =============================================================================
# Copy this file to .cookdocs.toml in your project root (or ~/.config/.cookdocs.toml)
# or pass it explicitly via -C / --config <path> (or COOK_DOCS_CONFIG)
# to customize default behavior.
#
# All settings below represent supported options and default values.
# Because every line is commented out, this file can be copied as-is without
# altering default behavior until settings are explicitly uncommented.
#
# Settings resolve in precedence order:
#   CLI Flags > Environment Variables > Config File > Hardcoded Defaults.
# =============================================================================

# -----------------------------------------------------------------------------
# Discovery & Output
# -----------------------------------------------------------------------------

# Directory to search recursively within for .cook recipe files.
# CLI: -c, --recipe-search-root <DIR> | Env: COOK_DOCS_RECIPE_SEARCH_ROOT
# recipe_search_root = "."

# Filename to use as an ignore file to exclude recipe files and directories.
# CLI: -i, --ignore-file <FILE> | Env: COOK_DOCS_IGNORE_FILE
# ignore_file = ".cookdocsignore"

# Custom output directory to write generated Markdown documentation.
# Mirrors relative directory structure under recipe_search_root.
# When empty, writes .md files alongside each .cook file.
# CLI: -o, --output-dir <DIR> | Env: COOK_DOCS_OUTPUT_DIR
# output_dir = ""

# Optional directory to copy companion recipe images into (slug-named).
# CLI: --assets-dir <DIR> | Env: COOK_DOCS_ASSETS_DIR
# assets_dir = ""

# Optional image extension override for Info.ImageSlug (e.g. "webp").
# CLI: --image-ext <EXT> | Env: COOK_DOCS_IMAGE_EXT
# image_ext = ""

# Do not write any Markdown files to disk; print rendered output to stdout instead.
# CLI: -d, --dry-run | Env: COOK_DOCS_DRY_RUN
# dry_run = false

# Parse recipes and print them in JSON format without rendering Markdown files.
# CLI: -j, --jsonify | Env: COOK_DOCS_JSONIFY
# jsonify = false

# Non-destructively merge generated content into existing Markdown files,
# preserving manual frontmatter, custom sections, admonitions, Mermaid diagrams, and tabs.
# Override per-run with --force to perform a full overwrite.
# CLI: --merge | Env: COOK_DOCS_MERGE
# merge = false

# -----------------------------------------------------------------------------
# Templates & Formatting
# -----------------------------------------------------------------------------

# Go template file paths used to generate documentation for each recipe.
# Filenames without a path separator are resolved relative to each recipe directory;
# relative paths are resolved relative to recipe_search_root.
# CLI: -t, --template-files <PATHS> (comma-separated) | Env: COOK_DOCS_TEMPLATE_FILES
# template_files = ["recipe.md.gotmpl"]

# Word wrap line length for the recipe steps section.
# CLI: -w, --word-wrap <LENGTH> | Env: COOK_DOCS_WORD_WRAP
# word_wrap = 120

# -----------------------------------------------------------------------------
# Template Enrichment & Doctor Validation
# -----------------------------------------------------------------------------

# Optional YAML/TOML/JSON file mapping ingredients and cookware to emojis.
# CLI: --emoji-file <PATH> | Env: COOK_DOCS_EMOJI_FILE
# emoji_file = ""

# Optional YAML/TOML/JSON ingredient density table for toGrams conversion.
# CLI: --weights-file <PATH> | Env: COOK_DOCS_WEIGHTS_FILE
# weights_file = ""

# Optional recipe subdirectories eligible for linkRecipe cross-linking.
# CLI: --link-dirs <DIRS> (comma-separated) | Env: COOK_DOCS_LINK_DIRS
# link_dirs = []

# Cross-link matching @ingredient references inside step directions (.Steps[*].Directions)
# using RecipeLinkIndex (default false for backwards compatibility).
# CLI: --link-in-steps | Env: COOK_DOCS_LINK_IN_STEPS
# link_in_steps = false

# Optional metadata keys required by `cook-docs doctor --check-recipes`.
# CLI: --required-metadata <KEYS> (comma-separated) | Env: COOK_DOCS_REQUIRED_METADATA
# required_metadata = []

# Optional YAML/TOML/JSON list of ingredients that should not be tagged with '@'
# (compatible with Cooklang config/ignored_ingredients.yaml; checked by `cook-docs doctor --check-recipes`).
# CLI: --ignored-ingredients-file <PATH> | Env: COOK_DOCS_IGNORED_INGREDIENTS_FILE
# ignored_ingredients_file = ""

# Optional inline list of ignored ingredients (merged with ignored_ingredients_file when both are set).
# Env: COOK_DOCS_IGNORED_INGREDIENTS (comma-separated)
# ignored_ingredients = []

# Inline emoji mappings may also be configured directly under [emoji]:
# [emoji.ingredients]
# herb = ["cilantro", "parsley"]
# [emoji.cookware]
# bowl_with_spoon = ["bowl"]
# [emoji.titles]
# pizza = ["pizza", "calzone"]
# [emoji.categories]
# breads = ":bread:"
# "desserts/cake" = ":birthday:"

# Optional default tags mapped by relative recipe directory path
# (exposed as .Info.DefaultTags and merged with .Frontmatter.tags into .Info.Tags):
# [category_tags]
# breads = ["bread"]
# "desserts/cake" = ["dessert", "cake"]

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------

# Log verbosity level.
# Supported values: "trace", "debug", "info", "warn" / "warning", "error"
# CLI: -l, --log-level <LEVEL> | Env: COOK_DOCS_LOG_LEVEL
# log_level = "info"
