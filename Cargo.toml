[package]
name = "cook-docs"
version = "0.9.6"
edition = "2024"
authors = ["Nicholas Wilde"]
description = "A tool for automatically generating markdown documentation for cooklang recipes"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "env"] }
clap_complete = "4.6"
clap_mangen = "0.3.3"
cooklang = "0.18.7"
env_logger = "0.11.10"
figment = { version = "0.10.19", features = ["toml", "yaml", "json", "env"] }
gtmpl-ng = "0.7.7"
ignore = "0.4.26"
log = "0.4.32"
notify = "9.0.0"
self_update = { version = "1.3.3", default-features = false, features = [
  "ureq",
  "rustls",
  "progress-bar",
  "github",
  "archive-tar",
  "compression-tar-gz",
  "archive-zip",
  "compression-zip-deflate",
  "checksums",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
walkdir = "2.5.0"

# Profile for final production releases (smaller, faster)
[profile.release]
opt-level = "z"   # Optimize for size
lto = true        # Link Time Optimization (smaller binary)
codegen-units = 1 # Reduce parallel code generation for better optimization
panic = "abort"   # Remove stack unwinding (smaller binary)
strip = true      # Strip symbols (smaller binary)

# Profile for CI/CD builds (inherits from dev)
[profile.ci]
inherits = "dev"
incremental = false # Disable incremental compilation for CI (often slower/buggy in CI cache)
debug = 0           # No debug info needed for basic CI checks (speeds up build)

[package.metadata.deb]
maintainer = "Nicholas Wilde <ncwilde43@gmail.com>"
copyright = "2026 Nicholas Wilde"
license-file = ["LICENSE", "4"]
extended-description = "A tool for automatically generating markdown documentation for cooklang recipes."
section = "utils"
priority = "optional"
assets = [
  [
    "target/release/cook-docs",
    "usr/bin/",
    "755",
  ],
  [
    "assets/cook-docs.1",
    "usr/share/man/man1/",
    "644",
  ],
  [
    "completions/cook-docs.bash",
    "usr/share/bash-completion/completions/cook-docs",
    "644",
  ],
  [
    "completions/_cook-docs",
    "usr/share/zsh/vendor-completions/_cook-docs",
    "644",
  ],
  [
    "completions/cook-docs.fish",
    "usr/share/fish/vendor_completions.d/cook-docs.fish",
    "644",
  ],
  [
    "docs/README.md",
    "usr/share/doc/cook-docs/README.md",
    "644",
  ],
]
