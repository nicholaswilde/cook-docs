---
version: '3'

dotenv: ['.env']

vars:
  ROOT_DIR:
    sh: git rev-parse --show-toplevel
  PORT: 8000

tasks:
  check:
    desc: Check code for errors without generating binary
    cmds:
      - cargo check
  clean:
    desc: Clean build artifacts
    cmds:
      - cargo clean
      - rm -rf dist cook-docs
  completions:
    desc: Generate shell completions for bash, zsh, fish, powershell, and elvish
    cmds:
      - mkdir -p completions
      - cargo run -- completions bash > completions/cook-docs.bash
      - cargo run -- completions zsh > completions/_cook-docs
      - cargo run -- completions fish > completions/cook-docs.fish
      - cargo run -- completions powershell > completions/_cook-docs.ps1
      - cargo run -- completions elvish > completions/cook-docs.elv
  man:
    desc: Generate UNIX roff man page (assets/cook-docs.1)
    cmds:
      - mkdir -p assets
      - cargo run -- man > assets/cook-docs.1
  coverage:
    desc: Run tests and generate coverage report (stdout summary)
    cmds:
      - cargo llvm-cov --all-features --workspace --summary-only
  coverage:report:
    desc: Run tests and generate LCOV coverage report (for Coveralls)
    cmds:
      - cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
  coverage:upload:
    desc: Upload coverage report to Coveralls
    precondition:
      - sh: test -f lcov.info
        msg: "lcov.info doesn't exist"
    cmds:
      - coveralls report lcov.info -n -r {{ .COVERALLS_REPO_TOKEN }}
    silent: true
  dist:
    desc: Create production release
    cmds:
      - cargo build --release
  build:local:
    desc: Build the project in release mode for the current architecture
    cmds:
      - cargo build --release
  build:ci:
    desc: Build using the CI profile (non-incremental)
    cmds:
      - cargo build --profile ci
  build-all:
    desc: Build for all architectures
    cmds:
      - task: build-linux
      - task: build-macos
      - task: build-windows
  build-linux:
    desc: Build for Linux architectures using cross
    cmds:
      - cross build --release --target x86_64-unknown-linux-musl
      - cross build --release --target aarch64-unknown-linux-musl
      - cross build --release --target armv7-unknown-linux-musleabihf
      - cross build --release --target arm-unknown-linux-gnueabihf
  build-macos:
    desc: Build for macOS architectures (requires macOS host)
    cmds:
      - cargo build --release --target x86_64-apple-darwin
      - cargo build --release --target aarch64-apple-darwin
  build-windows:
    desc: Build for Windows architectures using cross/cargo
    cmds:
      - cross build --release --target x86_64-pc-windows-msvc
      - cross build --release --target aarch64-pc-windows-msvc
  deps:
    desc: Download dependencies
    cmds:
      - cargo fetch
  dry-run:
    desc: Perform a dry run
    cmds:
      - cargo run -- --recipe-search-root testdata --dry-run
  debug:
    desc: Run program with debug logs
    cmds:
      - >
        cargo run -- --recipe-search-root testdata \
        --template-files testdata/recipe.md.gotmpl \
        --log-level debug --dry-run
  clippy:
    desc: Run cargo clippy
    cmds:
      - cargo clippy --workspace --all-targets --all-features -- -D warnings
  fmt:
    desc: Format Rust code
    cmds:
      - cargo fmt --all
  fmt:check:
    desc: Check code formatting with rustfmt
    cmds:
      - cargo fmt --all --check
  fmt:md:
    desc: Format Markdown files with rumdl
    cmds:
      - rumdl fmt .
  help:
    desc: Show app help
    cmds:
      - cargo run -- --help
  jsonify:
    desc: Jsonify the recipe
    cmds:
      - cargo run -- --jsonify
  lint:
    desc: Lint the project
    cmds:
      - yamllint-rs .
      - task: clippy
  lint:md:
    desc: Lint Markdown files with rumdl
    cmds:
      - rumdl check .
  run:
    desc: Run program
    cmds:
      - cargo run -- --recipe-search-root testdata
  serve:
    desc: Serve a zensical server
    cmds:
      - uv run zensical serve -a 0.0.0.0:{{ .PORT }}
  spellcheck:
    desc: Run typos spellcheck
    cmds:
      - typos
  test:
    desc: Run all tests (fmt, lint, and unit tests)
    cmds:
      - task: fmt:check
      - task: lint
      - cargo test
  test:ci:
    desc: Run tests using the CI profile
    cmds:
      - task: fmt:check
      - task: lint
      - cargo test --profile ci
  release:
    desc: Automated release tagging, validation, and version bump (./scripts/release.sh)
    cmds:
      - ./scripts/release.sh {{.CLI_ARGS}}
  release:summary:
    desc: Generate categorized release notes and update GitHub release (./scripts/release_summary.py)
    cmds:
      - uv run python3 scripts/release_summary.py {{.CLI_ARGS}}
  default:
    desc: Lists tasks with or without a description
    cmds:
      - task -a
    silent: true
